<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--text:#f6f2ef;--text2:#9a8f8a;--accent:#ff6a2b;--soft:#ffb58a}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
.serif{font-family:"Bitstream Charter",Charter,Georgia,serif}
#aura{position:absolute;left:-200px;right:-200px;bottom:-380px;height:1100px;filter:blur(70px)}
#aura i{position:absolute;border-radius:50%}
#world{position:absolute;inset:0}
.toast{position:absolute;width:760px;height:150px;border-radius:30px;background:linear-gradient(180deg,rgba(40,40,46,.96),rgba(26,26,31,.96));border:1.5px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;align-items:center;gap:28px;padding:0 34px;opacity:0}
.toast .ic{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;flex:none}
.toast b{display:block;font-size:36px;font-weight:650}
.toast small{font-size:27px;color:var(--text2)}
.toast .x{margin-left:auto;font-size:34px;color:var(--text2)}
#orb{position:absolute;left:0;top:0;z-index:30}
#orb b{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffe1c4 30%,rgba(255,96,32,.6) 55%,transparent 72%);transform:translate(-50%,-50%)}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd0a8;box-shadow:0 0 18px #ff6a2b;opacity:0;z-index:25}
#win{position:absolute;left:110px;top:560px;width:860px;border-radius:44px;background:linear-gradient(180deg,rgba(28,27,32,.95),rgba(14,13,17,.96));border:1.5px solid rgba(255,255,255,.1);box-shadow:0 60px 160px rgba(0,0,0,.7);overflow:hidden;opacity:0}
.bar{height:96px;display:flex;align-items:center;gap:18px;padding:0 40px;border-bottom:1.5px solid rgba(255,255,255,.08);font-size:34px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;height:124px;padding:0 44px;font-size:38px;border-top:1.5px solid rgba(255,255,255,.07)}
.row:first-of-type{border-top:0}
.tg{width:104px;height:60px;border-radius:30px;position:relative}
.tg b{position:absolute;top:7px;left:7px;width:46px;height:46px;border-radius:50%;background:#fff}
#shield{position:absolute;left:0;right:0;top:600px;display:flex;justify-content:center;opacity:0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff 0%,#ffe4d0 35%,rgba(255,160,110,0) 75%);opacity:0;z-index:40}
#end{position:absolute;left:0;right:0;top:560px;display:flex;flex-direction:column;align-items:center;opacity:0;z-index:35}
.pill{display:inline-flex;align-items:center;padding:28px 60px;border-radius:999px;font-size:40px;font-weight:650}
</style></head>
<body>
<div id="aura"><i id="a1"></i><i id="a2"></i><i id="a3"></i></div>
<div id="world">
  <div id="toasts"></div>
  <div id="win">
    <div class="bar"><svg viewBox="0 0 256 256" width="50" height="50"><rect width="256" height="256" rx="56" fill="#0A0A0C"/><path d="M202 54 L70 110 L128 128 L146 186 Z" fill="#fff"/><path d="M56 172 L80 196 L118 158" fill="none" stroke="#2997FF" stroke-width="18" stroke-linecap="round"/></svg>TweakPilot</div>
    <div id="rows"></div>
  </div>
  <div id="shield">
    <div style="position:relative;width:460px;height:460px">
      <svg viewBox="0 0 120 120" width="460" height="460" style="position:absolute;inset:0;transform:rotate(-90deg)">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#ff6a2b" stroke-width="6" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="filter:drop-shadow(0 0 6px #ff6a2b)"/>
      </svg>
      <svg viewBox="0 0 24 24" width="210" height="210" style="position:absolute;left:125px;top:125px" fill="none" stroke="#f6f2ef" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path id="shieldCheck" d="M8.5 12l2.5 2.5 4.5-5" stroke="#ff8a3d" stroke-width="2.2" stroke-dasharray="12" stroke-dashoffset="12"/></svg>
    </div>
  </div>
</div>
<div id="sparks"></div>
<div id="end">
  <svg id="endIcon" viewBox="0 0 256 256" width="230" height="230" style="filter:drop-shadow(0 0 70px rgba(255,96,32,.65))"><rect x="4" y="4" width="248" height="248" rx="55" fill="#0A0A0C"/><rect x="5" y="5" width="246" height="246" rx="54" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/><path d="M202 54 L70 110 L128 128 L146 186 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/><path id="endCheck" d="M56 172 L80 196 L118 158" fill="none" stroke="#2997FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
  <div id="endWord" class="serif" style="margin-top:56px;font-size:130px;letter-spacing:-.02em">TweakPilot</div>
  <div id="endTag" class="serif" style="margin-top:22px;font-size:76px;font-style:italic;color:var(--soft)">Tweak anything.</div>
  <div id="endLink" class="pill" style="margin-top:80px;background:#fff;color:#000">Link in bio</div>
</div>
<div id="orb"></div>
<div id="flash"></div>

<script>
const T = /*T*/;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = p => 1 - Math.pow(1 - clamp(p), 3);
const inOut = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const back = p => { p = clamp(p); const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const prog = (t, s, d = .4) => clamp((t - s) / d);
const bell = (t, s, d) => Math.sin(Math.PI * clamp((t - s) / d));
const $ = id => document.getElementById(id);

// Pop-ups: [title, subtitle, icon colour, x, y, rotation]
const TOASTS = /*TOASTS*/;
const ICONS = ['M4 12h16M12 4v16', 'M12 3v10m0 4v1', 'M5 12l5 5 9-9', 'M4 6h16v12H4z', 'M12 6v6l4 2', 'M6 6l12 12M18 6L6 18'];
$('toasts').innerHTML = TOASTS.map((t, i) => `<div class="toast" id="t${i}" style="left:${t[3]}px;top:${t[4]}px"><span class="ic" style="background:${t[2]}"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="${ICONS[i % ICONS.length]}"/></svg></span><span><b>${t[0]}</b><small>${t[1]}</small></span><span class="x">&times;</span></div>`).join('');
const ROWS = ['Ads in Start', 'Tips and suggestions', 'Advertising ID', 'Background apps', 'Activity history'];
$('rows').innerHTML = ROWS.map((r, i) => `<div class="row"><span>${r}</span><div class="tg" id="g${i}"><b></b></div></div>`).join('');

// Sparks for every dissolving pop-up.
const SP = [];
TOASTS.forEach((_, i) => { for (let k = 0; k < 14; k++) { const s = document.createElement('div'); s.className = 'spark'; $('sparks').appendChild(s); SP.push({ i, a: (k / 14) * Math.PI * 2 + i, v: 160 + (k * 37) % 140, el: s }); } });

const A = [[$('a1'), 900, 520, 'rgba(220,30,10,.95)'], [$('a2'), 700, 420, 'rgba(255,100,30,.8)'], [$('a3'), 520, 300, 'rgba(255,190,120,.55)']];
A.forEach(([el, w, h, c]) => { el.style.width = w + 'px'; el.style.height = h + 'px'; el.style.background = c; });
const orb = $('orb'); for (let i = 0; i < 16; i++) orb.appendChild(document.createElement('b'));

const center = i => [TOASTS[i][3] + 380, TOASTS[i][4] + 75];
// Orb keys: [time, x, y, size]
const KEYS = [[T.orbIn, 540, 1900, 20], [T.orbIn + .5, 540, 1180, 34]];
TOASTS.forEach((_, i) => { const [x, y] = center(i); KEYS.push([T.sweep + i * T.gap, x, y, 30]); });
KEYS.push([T.clean - .1, 900, 470, 22], [T.flip + 4 * T.flipGap + .3, 960, 520, 22], [T.flash - .05, 540, 760, 50]);
function orbAt(t) {
  if (t <= KEYS[0][0]) return KEYS[0].slice(1);
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, x0, y0, s0] = KEYS[i], [t1, x1, y1, s1] = KEYS[i + 1];
    if (t <= t1) { const p = inOut((t - t0) / (t1 - t0)), arc = Math.sin(Math.PI * p) * 90; return [x0 + (x1 - x0) * p + arc, y0 + (y1 - y0) * p - arc * .4, s0 + (s1 - s0) * p]; }
  }
  return KEYS[KEYS.length - 1].slice(1);
}

function setTime(t) {
  // Horizon: restless during the chaos, calm afterwards.
  const chaos = 1 - ease(prog(t, T.sweep, 2));
  A.forEach(([el, w, h], i) => {
    const x = 620 - w / 2 + Math.sin(t * (.35 + i * .17 + chaos * 2) + i) * (130 + 80 * chaos), y = 1100 - h + Math.sin(t * (.5 + i * .11)) * 40;
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.opacity = .7 + .3 * chaos + .2 * bell(t, T.flash - .3, 1.2);
  });

  // Chaos: pop-ups stack up fast, the screen shakes a little.
  const shake = chaos * (t < T.sweep ? 1 : 0) * ease(prog(t, .8, 1.2));
  $('world').style.transform = `translate(${Math.sin(t * 47) * 7 * shake}px, ${Math.cos(t * 53) * 6 * shake}px)`;
  TOASTS.forEach((tt, i) => {
    const el = $('t' + i), tin = T.pop + i * T.popGap, tout = T.sweep + i * T.gap;
    const pin = back(prog(t, tin, .35)), gone = ease(prog(t, tout - .02, .18));
    el.style.opacity = ease(prog(t, tin, .15)) * (1 - gone);
    el.style.transform = `rotate(${tt[5]}deg) scale(${(.6 + .4 * pin) * (1 - .4 * gone)})`;
    el.style.filter = `blur(${12 * gone}px)`;
  });
  SP.forEach(s => {
    const at = T.sweep + s.i * T.gap, p = prog(t, at, .6), [cx, cy] = center(s.i);
    s.el.style.opacity = p > 0 && p < 1 ? 1 - p : 0;
    s.el.style.left = cx + Math.cos(s.a) * s.v * ease(p) + 'px';
    s.el.style.top = cy + Math.sin(s.a) * s.v * ease(p) + 60 * p * p + 'px';
  });

  // Clean window: switches fall like dominoes.
  const w = $('win'), win = ease(prog(t, T.clean, .5)), wout = ease(prog(t, T.shield - .2, .35));
  w.style.opacity = win * (1 - wout);
  w.style.transform = `perspective(1600px) translateY(${120 * (1 - win) - 80 * wout}px) rotateX(${14 * (1 - win)}deg) scale(${.88 + .12 * win - .08 * wout})`;
  w.style.filter = `blur(${16 * (1 - win) + 18 * wout}px)`;
  ROWS.forEach((_, i) => {
    const g = $('g' + i), off = ease(prog(t, T.flip + i * T.flipGap, .18));
    g.style.background = `rgba(${255 - 200 * off},${106 - 50 * off},${43 + 20 * off},${1 - .8 * off})`;
    g.querySelector('b').style.transform = `translateX(${44 * (1 - off)}px)`;
  });

  // Shield: the ring fills, the check draws.
  const sh = $('shield'), sin = ease(prog(t, T.shield, .4)), sout = ease(prog(t, T.flash - .35, .3));
  sh.style.opacity = sin * (1 - sout);
  sh.style.transform = `scale(${.8 + .2 * back(prog(t, T.shield, .5)) + .1 * sout})`;
  sh.style.filter = `blur(${14 * sout}px)`;
  $('ring').style.strokeDashoffset = 326.7 * (1 - inOut(prog(t, T.shield + .2, T.saved - T.shield - .2)));
  $('shieldCheck').style.strokeDashoffset = 12 - 12 * ease(prog(t, T.saved, .3));

  // Flash and end card.
  $('flash').style.opacity = .85 * bell(t, T.flash - .1, .6);
  $('end').style.opacity = ease(prog(t, T.flash + .1, .3));
  $('endIcon').style.transform = `scale(${.5 + .5 * back(prog(t, T.flash + .1, .6))})`;
  $('endCheck').style.strokeDashoffset = 100 - 100 * ease(prog(t, T.flash + .4, .45));
  [['endWord', T.word], ['endTag', T.tag]].forEach(([id, at]) => {
    $(id).style.opacity = ease(prog(t, at, .4)); $(id).style.filter = `blur(${12 * (1 - ease(prog(t, at, .45)))}px)`;
    $(id).style.transform = `translateY(${24 * (1 - ease(prog(t, at, .5)))}px)`;
  });
  $('endLink').style.opacity = ease(prog(t, T.link, .25));
  $('endLink').style.transform = `translateY(${30 * (1 - back(prog(t, T.link, .45)))}px)`;

  // Orb with trail.
  const ov = Math.min(ease(prog(t, T.orbIn, .2)), 1 - ease(prog(t, T.flash - .05, .1)));
  [...orb.children].forEach((b, i) => {
    const [x, y, s] = orbAt(t - i * .02), k = 1 - i / 16, size = s * (i === 0 ? 2.2 : 1.4) * k;
    b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.width = b.style.height = size + 'px';
    b.style.opacity = ov * (i === 0 ? 1 : .55 * k);
  });
}
window.setTime = setTime;
setTime(0);
</script>
</body></html>
